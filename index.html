<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finanzas App</title>
<style>
  :root{

    --line:#e7ecf4; --primary:#4c7df3; --primary2:#eaf1ff; --good:#22a06b; --goodbg:#eaf8f1;
    --warn:#e89b19; --warnbg:#fff7e8; --danger:#d64d4d; --dangerbg:#fff0f0; --third:#8b5cf6;

    --status-assumed:#FFCC00; --status-recovered:#32ADE6;
    --status-pending-bg:rgba(255,149,0,.095); --status-pending-border:rgba(255,149,0,.28);

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}

  button{cursor:pointer}
  .app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:30}

  .nav{display:flex;flex-direction:column;gap:5px}

  .main{min-width:0}

  .periodbar{display:flex;align-items:center;gap:18px;min-width:0;max-width:1450px;margin:0 auto}

  .months::-webkit-scrollbar{display:none}
  .months button{border:0;background:transparent;color:#44526a;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;white-space:nowrap;transition:background .16s ease,color .16s ease,box-shadow .16s ease}
  .months button:hover{background:#f5f7fb;color:#24324b}
  .months button.active{background:#2858c2;color:#fff;font-weight:650;box-shadow:0 5px 14px rgba(40,88,194,.18)}
  .content{padding:26px;max-width:1450px;margin:auto}
  .pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
  .pagehead h1{margin:0;font-size:var(--fs-page);line-height:var(--lh-tight);letter-spacing:-.6px}.pagehead p{margin:6px 0 0;color:var(--muted);font-size:var(--fs-body);line-height:var(--lh-body)}
  .btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(76,125,243,.18)}

  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.card.flat{box-shadow:none}.card h3{margin:0 0 14px;font-size:var(--fs-card);line-height:var(--lh-tight)}

  .home-summary .metric-available{border-color:rgba(52,199,89,.74);background:rgba(52,199,89,.075)}
  .home-summary .metric-available .label,.home-summary .metric-available .value{color:#34C759}

  .movements-summary .metric-months{border-color:rgba(125,78,43,.62);background:rgba(125,78,43,.06)}

  .thirdbar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:13px;border-radius:13px;background:var(--surface2);border:1px solid var(--line)}.mini b{display:block;font-size:var(--fs-amount);line-height:var(--lh-tight);margin-top:4px}.mini span{font-size:var(--fs-meta);line-height:var(--lh-body);color:var(--muted)}
  .chart-list{display:flex;flex-direction:column;gap:13px}.chart-row{display:grid;grid-template-columns:86px minmax(0,1fr) 110px;align-items:center;gap:12px}.chart-label{font-weight:800;font-size:13px}.chart-label small{display:block;color:var(--muted);font-weight:650;margin-top:3px}.track{height:11px;border-radius:999px;background:#eef2f7;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#4c7df3,#6d8ff5)}.amount{text-align:right;font-weight:850}.amount small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .logo-box{width:82px;height:34px;border-radius:10px;overflow:hidden;background:#eef2f7;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}.logo-box img{max-width:none;user-select:none;pointer-events:none}.logo-fallback{font-size:11px;font-weight:900;letter-spacing:.2px;color:#52617a;text-align:center;padding:4px}
  .card-chart-row{display:grid;grid-template-columns:88px 128px minmax(0,1fr) 110px;align-items:center;gap:12px}.card-chart-row .name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Inicio · beauty pass: solo presentación. No toca lógica. */

  .home-overview-grid>.card{min-width:0}
  /* Inicio · títulos principales homologados */
  .home-overview-grid .section-title h2{font-size:20px;font-weight:700;line-height:1.18;letter-spacing:-.3px}
  .home-overview-grid .section-title h2 svg{width:19px;height:19px;flex:0 0 19px;margin-right:8px}
  .home-statements-card > .section-title h2{font-size:20px;font-weight:700;line-height:1.18;letter-spacing:-.3px}
  .home-statements-card > .section-title h2 svg{width:19px;height:19px;flex:0 0 19px;margin-right:8px}
  .home-third-card{grid-area:third}
  .home-card-chart{grid-area:cards}
  .home-category-card{grid-area:category}
  .home-third-card .section-title{margin-bottom:5px}

  .category-legend-row b{text-align:right;font-size:var(--fs-body);font-weight:650;line-height:var(--lh-tight)}.category-legend-row small{text-align:right;color:var(--muted);font-size:var(--fs-caption);line-height:var(--lh-tight);font-weight:650}
  .home-card-chart .section-title .hint{font-size:16px;font-weight:750;letter-spacing:-.2px;color:#5f6f89}

  const payDay=Number(card.payDay||1);

  if(!Number.isFinite(my)||my<0){my=0}

function normalizeState(incoming){

    if(incoming[key]!=null&&!Array.isArray(incoming[key]))throw new Error('Colección inválida: '+key);
    incoming[key]=incoming[key]||defaults[key];
  }
  for(const key of ['meta','ui','salaryOverrides','savings','statementTotalOverrides']){
    if(incoming[key]!=null&&(typeof incoming[key]!=='object'||Array.isArray(incoming[key])))throw new Error('Configuración inválida');
    incoming[key]={...defaults[key],...(incoming[key]||{})};
  }
  for(const m of incoming.movements){
    if(!m||!m.id||!['variable','fixed','months'].includes(m.type)||!/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')||!Number.isFinite(new Date(m.date+'T12:00:00').getTime()))throw new Error('Movimiento inválido');

    if(!Number.isFinite(amount)||amount<0)throw new Error('Monto inválido');
    // Migración única: los campos legacy se convierten a campos canónicos.
    // A partir de aquí ninguna vista ni cálculo depende de datos heredados ocultos.
    if(m.type==='months'&&!m.firstPaymentYM&&m.legacyPaymentStartYM)m.firstPaymentYM=m.legacyPaymentStartYM;
    if(m.type==='fixed'&&!m.paymentStartYM&&m.legacyPaymentStartYM)m.paymentStartYM=m.legacyPaymentStartYM;

function detectLogoBackground(dataUrl){
  return new Promise(resolve=>{
    if(!dataUrl){resolve(null);return}
    const img=new Image();
    img.onload=()=>{
      try{
        const max=180,ratio=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1)),w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
        const px=ctx.getImageData(0,0,w,h).data,samples=[],step=Math.max(1,Math.floor(Math.min(w,h)/24));
        const add=(x,y)=>{const i=(y*w+x)*4,a=px[i+3];samples.push([px[i],px[i+1],px[i+2],a])};
        for(let x=0;x<w;x+=step){add(x,0);if(h>1)add(x,h-1)}
        for(let y=step;y<h-step;y+=step){add(0,y);if(w>1)add(w-1,y)}
        if(!samples.length){resolve(null);return}
        const transparent=samples.filter(p=>p[3]<40).length/samples.length;
        if(transparent>.55){resolve(null);return}
        const opaque=samples.filter(p=>p[3]>210);if(opaque.length<Math.max(4,samples.length*.55)){resolve(null);return}
        const buckets=new Map();
        opaque.forEach(([r,g,b])=>{const q=v=>Math.round(v/16)*16,key=`${q(r)},${q(g)},${q(b)}`;const cur=buckets.get(key)||{n:0,r:0,g:0,b:0};cur.n++;cur.r+=r;cur.g+=g;cur.b+=b;buckets.set(key,cur)});
        const best=[...buckets.values()].sort((a,b)=>b.n-a.n)[0];
        if(!best||best.n/opaque.length<.58){resolve(null);return}
        const r=best.r/best.n,g=best.g/best.n,b=best.b/best.n;
        const near=opaque.filter(([rr,gg,bb])=>Math.sqrt((rr-r)**2+(gg-g)**2+(bb-b)**2)<38).length/opaque.length;
        if(near<.68){resolve(null);return}
        resolve(rgbHex(r,g,b));
      }catch(e){resolve(null)}
    };
    img.onerror=()=>resolve(null);img.src=dataUrl;
  })
}

  if(Number.isFinite(day)&&day>0)return day;
  const card=cardById(o?.movement?.cardId);
  if(card?.type==='credit')return Math.max(1,Number(card.payDay||1));
  const chargeDay=Number(String(o?.chargeDate||'').slice(8,10));
  return Number.isFinite(chargeDay)&&chargeDay>0?chargeDay:1;
}

function summaryMonthKeys(from,to){
  const valid=s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(s);
  if(!valid(from)||!valid(to)||from>to)throw Error('Elige un rango de meses válido.');
  const keys=[];for(let key=from;key<=to;key=addMonthsYM(key,1)){keys.push(key);if(keys.length>120)throw Error('Elige un rango de hasta 10 años.')}return keys;
}
function buildFinancialReport(from,to){
  const keys=summaryMonthKeys(from,to),label=key=>{const p=parseYM(key);return monthLabel(p.year,p.month)},fmt=value=>money(Math.round(Number(value||0)*100)/100);
  const lines=['RESUMEN GENERAL · FINANZAS APP',`Periodo: ${label(from)}${from===to?'':' a '+label(to)}`,`Generado: ${dateMxLong(todayISO())}`,'Moneda: pesos mexicanos (MXN).','',
  'CÓMO LEER ESTE RESUMEN','El presupuesto agrupa crédito por mes de corte; débito y efectivo por mes del gasto. Las fechas de pago pueden caer en otro mes. Disponible es presupuesto calculado, no saldo bancario. Los datos son lo registrado en la app; meses futuros son proyecciones. Los checks indican pagos registrados, no transferencias bancarias.',''];
  const totals={income:0,my:0,savings:0,recovery:0,available:0,thirdPending:0};
  for(const key of keys){const s=monthSummary(key);Object.keys(totals).forEach(k=>totals[k]+=Number(s[k]||0));lines.push(`MES: ${label(key)}`,`Sueldo: ${fmt(s.sal.total)} (quincena 1: ${fmt(s.sal.q1)}; quincena 2: ${fmt(s.sal.q2)})`,`Ingreso extra: ${fmt(s.extras)}`,`Ingresos totales: ${fmt(s.income)}`,`Recuperaciones de saldos asumidos: ${fmt(s.recovery)}`,`Mi gasto: ${fmt(s.my)}`,`Ahorro aplicado: ${fmt(s.savings)}`,`Disponible presupuestado: ${fmt(s.available)}`,`Parte de terceros: ${fmt(s.third)}; recibido: ${fmt(s.thirdPaid)}; pendiente: ${fmt(s.thirdPending)}`,`Saldo ajeno asumido por mí: ${fmt(s.assumed)}`);
    const saving=state.savings[key]||{};lines.push(`Ahorro estimado: ${fmt(saving.estimated)}; real: ${saving.real==null||saving.real===''?'sin capturar':fmt(saving.real)}`,'','MI GASTO POR TIPO');
    for(const type of ['fixed','months','variable']){const value=s.occ.filter(o=>o.movement.type===type).reduce((sum,o)=>sum+sharesForOccurrence(o).my+assumptionForOccurrence(o.movement.id,o.paymentYM),0);lines.push(`${typeLabel(type)}: ${fmt(value)}`)}
    lines.push('','MI GASTO POR CATEGORÍA');for(const cat of categoriesSummary(key))lines.push(`${cat.name}: ${fmt(cat.amount)}`);
    lines.push('','ESTADOS DE TARJETAS DEL CORTE');for(const card of state.cards.filter(c=>c.type==='credit')){const st=cardStatement(card.id,key);if(!st.total&&!st.occ.length)continue;lines.push(`${card.name}: total ${fmt(st.total)}; mi parte ${fmt(st.my)}; terceros ${fmt(st.third)}; pendiente de terceros ${fmt(st.pending)}; pago ${dateMxLong(st.dueDate||dueDateForPaymentYM(card,paymentYMForStatement(card,key)))}; ${st.paid?'pagado':'pendiente'}`);if(Math.abs(st.reconciliationDifference)>.005)lines.push(`  Diferencia entre total del estado y cargos registrados: ${fmt(st.reconciliationDifference)}`)}
    lines.push('','DETALLE DE MOVIMIENTOS');for(const o of s.occ){const m=o.movement,sh=sharesForOccurrence(o),cov=thirdCoverageForOccurrence(o);lines.push(`${m.concept} | ${typeLabel(m.type)} | ${categoryById(m.categoryId)?.name||'Sin categoría'} | ${cardById(m.cardId)?.name||'Sin tarjeta / efectivo'} | compra original ${dateMxLong(m.date)} | cargo del periodo ${dateMxLong(o.chargeDate)} | pago ${dateMxLong(o.dueDate)} | total ${fmt(o.amount)} | mi parte ${fmt(sh.my)} | terceros ${fmt(sh.third)} | ${ownerLabel({...m,...sh.owner})}${m.type==='months'?' | cuota '+o.index+' de '+m.installments:''} | ${isOccurrenceCardPaid(o)?'pago registrado':'sin pago registrado'}${cov.pending>.005?' | terceros pendientes '+fmt(cov.pending):''}${assumptionForOccurrence(m.id,o.paymentYM)?' | asumido por mí '+fmt(assumptionForOccurrence(m.id,o.paymentYM)):''}${m.importSource?.purchaseDateConfirmed===false?' | fecha de compra pendiente de confirmar':''}`)}
    const extras=state.extras.filter(e=>e.date?.slice(0,7)===key);if(extras.length){lines.push('','DETALLE DE INGRESOS EXTRA');extras.forEach(e=>lines.push(`${e.concept}: ${fmt(e.amount)} · ${dateMxLong(e.date)}`))}lines.push('','');
  }
  lines.push('TOTALES DEL RANGO',`Ingresos: ${fmt(totals.income)}`,`Mi gasto: ${fmt(totals.my)}`,`Ahorro aplicado: ${fmt(totals.savings)}`,`Recuperaciones: ${fmt(totals.recovery)}`,`Disponible presupuestado acumulado: ${fmt(totals.available)}`,`Pendiente de terceros de los cortes incluidos: ${fmt(totals.thirdPending)}`,'','PAGOS CON VENCIMIENTO DENTRO DEL RANGO CALENDARIO','Esta lista usa el mes de pago, no el mes del corte, e incluye cargos de cortes anteriores que vencen en el rango. No se suma otra vez a los totales del presupuesto.');
  const due=state.movements.filter(m=>!m.archived).flatMap(m=>movementOccurrences(m,parseYM(to).year)).filter(o=>o.paymentYM>=from&&o.paymentYM<=to).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  for(const o of due){const sh=sharesForOccurrence(o);lines.push(`${dateMxLong(o.dueDate)} | ${cardById(o.movement.cardId)?.name||'Sin tarjeta / efectivo'} | ${o.movement.concept} | total ${fmt(o.amount)} | mi parte ${fmt(sh.my+assumptionForOccurrence(o.movement.id,o.paymentYM))} | ${isOccurrenceCardPaid(o)?'pago registrado':'sin pago registrado'}`)}
  lines.push('','PLANES A MESES: CUOTAS POSTERIORES AL RANGO','Proyección de cuotas futuras registradas; no es una consulta del saldo del banco.');
  for(const m of state.movements.filter(m=>!m.archived&&m.type==='months')){const future=movementOccurrences(m).filter(o=>o.statementYM>to&&!isOccurrenceCardPaid(o));if(!future.length)continue;lines.push(`${m.concept} | ${cardById(m.cardId)?.name||'Sin tarjeta'} | ${future.length} cuotas posteriores sin pago registrado | total ${fmt(future.reduce((v,o)=>v+o.amount,0))} | mi parte ${fmt(future.reduce((v,o)=>v+sharesForOccurrence(o).my+assumptionForOccurrence(m.id,o.paymentYM),0))} | último pago ${dateMxLong(future[future.length-1].dueDate)}`)}
  return lines.join('\n');
}
function openSummaryExport(){openModal('Descargar resumen general','Elige un mes o un rango. Puedes enviarme el archivo para revisar tu presupuesto.',`<div class="form-grid"><div class="form-field"><label for="reportFrom">Desde</label><input id="reportFrom" type="month" value="${selectedYM()}"></div><div class="form-field"><label for="reportTo">Hasta</label><input id="reportTo" type="month" value="${selectedYM()}"></div></div><p class="help">Para un solo mes, elige el mismo en ambos campos. Incluye ingresos, ahorro, gastos, tarjetas, responsables y fechas de pago.</p>`,`<button class="btn secondary" id="cancelReport">Cancelar</button><button class="btn" id="downloadReport">Descargar resumen (.txt)</button>`);$('#cancelReport').onclick=closeModal;$('#downloadReport').onclick=()=>{try{const from=formVal('reportFrom'),to=formVal('reportTo'),report=buildFinancialReport(from,to),blob=new Blob([report],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MiFinanzas_Resumen_${from}${from===to?'':'_a_'+to}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeModal();toast('Resumen descargado ✓')}catch(e){toast(e.message)}}}

function openAppGuide(){
  openModal('¿Cómo funciona la app?','Una guía sencilla para saber qué capturar y qué significa cada cantidad.',`<div class="app-guide">
  <div class="app-guide-intro">Piensa en la app como una libreta: anotas cuánto ganas, tus gastos y qué parte paga cada persona. La app hace las sumas. <b>Los checks registran pagos; no envían dinero al banco.</b></div>
  <details open><summary>1. ¿Por dónde empiezo?</summary><div class="app-guide-content"><p>En <b>Tarjetas → Mis tarjetas</b>, registra tus tarjetas y sus días de corte y pago. En <b>Ingresos</b>, escribe cuánto ganas en cada quincena. Después añade tus gastos en <b>Movimientos</b>.</p><p>Para cada gasto elige tarjeta, fecha real de compra, tipo, responsable y monto. Si pagaste con débito, usa tu tarjeta de débito.</p></div></details>
  <details open><summary>2. ¿Por qué un gasto aparece en un mes y se paga en otro?</summary><div class="app-guide-content"><p>El <b>corte</b> es el día en que el banco cierra una lista de compras. La <b>fecha de pago</b> es el día límite para pagar esa lista.</p><p>Los meses de arriba reúnen los gastos de crédito por <b>mes de corte</b>. En cada movimiento y tarjeta puedes consultar cuándo se pagan.</p><div class="app-guide-example">Si tu tarjeta corta el <b>25 de septiembre</b> y se paga el <b>15 de octubre</b>: una compra del 20 de septiembre aparece en <b>septiembre</b> y se paga en octubre. Una compra del 26 de septiembre pasa al corte de <b>octubre</b> y se paga en noviembre.</div><p>Que septiembre se pague en octubre <b>no significa que vayas atrasado</b>. Son dos fechas distintas. Los cuadritos de las mensualidades muestran el <b>mes del corte al que pertenece cada cuota</b>; la fecha de pago se muestra aparte.</p><div class="app-guide-example"><b>¿Qué significa ✓?</b> El check marca la mensualidad/corte que ya quedó cubierta. Si septiembre se paga el 1 de octubre y ya recibiste ese dinero, se marca <b>Sep ✓</b>, no Oct.</div></div></details>
  <details><summary>3. ¿Y la renta o los pagos con débito?</summary><div class="app-guide-content"><p>Débito y efectivo no tienen corte de crédito: se muestran en el mes del gasto.</p><div class="app-guide-example">Una renta pagada con débito el <b>7 de octubre</b> aparece en octubre. No se mueve a noviembre.</div></div></details>
  <details><summary>4. ¿Qué significa mío, compartido y de otra persona?</summary><div class="app-guide-content"><p><b>Mío:</b> todo el gasto te corresponde. <b>Compartido:</b> solo tu parte se suma a “Mi gasto”. <b>De otra persona:</b> se registra en tu tarjeta, pero no se suma como gasto tuyo.</p><div class="app-guide-example">Una comida cuesta <b>$1,000</b>. Tú pagas $400 y otra persona $600: “Mi gasto” suma <b>$400</b>; la tarjeta debe <b>$1,000</b>; en Personas quedan $600 por recibir.</div><p>La <b>categoría</b> describe en qué gastaste. El <b>responsable</b> determina quién paga: elegir la categoría “Gastos terceros” no cambia automáticamente al responsable.</p><p>Cuando alguien te entregue dinero, regístralo en <b>Personas</b>. Cuando pagues al banco, marca el estado de la tarjeta como pagado. Son dos registros distintos.</p></div></details>
  <details><summary>5. ¿Qué tipo de gasto elijo?</summary><div class="app-guide-content"><p><b>Variado:</b> una compra o cargo de una sola vez, como comida o gasolina.</p><p><b>Fijo:</b> se repite cada mes, como renta o internet.</p><p><b>A meses:</b> una compra dividida en mensualidades. Escribe el monto original y el número de mensualidades. “1 de 12” significa primera mensualidad de doce; el check indica si ya registraste su pago.</p></div></details>
  <details><summary>6. ¿Cómo leo Inicio y mi disponible?</summary><div class="app-guide-content"><p><b>Ingresos:</b> sueldo y extras del mes. <b>Mi gasto:</b> gastos tuyos, tu parte compartida y saldos ajenos que hayas decidido asumir. <b>Ahorro:</b> dinero que apartas.</p><div class="app-guide-example">Ingresos $20,000 − mi gasto $8,000 − ahorro $2,000 = <b>$10,000 disponibles</b>.</div><p>“Disponible” es una cuenta de tu <b>presupuesto del periodo elegido</b>; no consulta el saldo de tu banco. Como los gastos de crédito se agrupan por corte, algunos se pagan el mes siguiente.</p><p>En <b>Cuándo necesitas el dinero</b>, revisa las fechas completas de pago: los grupos del 1 al 14 y desde el 15 se forman por el día de vencimiento de esas tarjetas. En <b>Tarjetas</b> aparece el total del banco, incluyendo lo de otras personas.</p></div></details>
  <details><summary>7. ¿Cómo funcionan sueldo, ahorro y respaldos?</summary><div class="app-guide-content"><p>El <b>sueldo predeterminado</b> es tu base para todos los meses. Si cambia desde un mes, usa <b>Cambiar sueldo desde un mes</b>. Para modificar solo un mes, usa <b>Ajustar ingreso de este mes</b>.</p><p>En <b>Ahorro</b>, el estimado es lo que planeas apartar y el real es lo que apartaste. Si el real está vacío, se usa el estimado; si escribes 0, se usa 0.</p><p>En <b>Configuración</b>, descarga un respaldo para conservar tus datos o llevarlos a otro equipo. El archivo descargado y la app de GitHub no sincronizan sus registros automáticamente.</p></div></details>
  </div>`,`<button class="btn" id="closeAppGuide">Entendido</button>`,true);
  $('#closeAppGuide').onclick=closeModal;
}

}
